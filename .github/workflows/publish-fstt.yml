name: Publicar imagem FSTT
# Repositório: https://github.com/SalvaodorAssuilo/documenso-fstt

# Constrói a imagem Docker do fork (linux/amd64, a arquitectura da VPS) e
# publica-a no GitHub Container Registry. Nunca se constrói na VPS: 1 vCPU.
#
# Tag da imagem: <versão do Documenso>-fstt.<N>, p.ex. 2.17.0-fstt.1.
# A versão vem de apps/remix/package.json; o N vem do input ao disparar.

on:
  workflow_dispatch:
    inputs:
      revisao:
        description: 'Número da revisão FSTT (o N em 2.17.0-fstt.N)'
        required: true
        default: '1'

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Libertar espaço no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: tags
        run: |
          VERSAO="$(node -p "require('./apps/remix/package.json').version")"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGEM="ghcr.io/${OWNER}/documenso-fstt"
          TAG="${VERSAO}-fstt.${{ inputs.revisao }}"
          echo "imagem=${IMAGEM}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Imagem: ${IMAGEM}:${TAG}"

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.imagem }}:${{ steps.tags.outputs.tag }}
            ${{ steps.tags.outputs.imagem }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Documenso FSTT
            org.opencontainers.image.version=${{ steps.tags.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.tags.outputs.imagem }}:${{ steps.tags.outputs.tag }}`' >> "$GITHUB_STEP_SUMMARY"
